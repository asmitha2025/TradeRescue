name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend, demo and failure lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # packet.js, engine.js, service.js and store.js have no dependencies
      # of their own, so the tests, the demo check and the lab all run
      # without an install. Only index.js needs firebase-admin.
      - name: Backend tests
        working-directory: firebase/functions
        run: npm test

      # The demo page carries its own reimplementation of the server
      # checks. This drives that code headlessly so the page cannot drift
      # away from the backend unnoticed.
      - name: Demo page checks
        run: node demo/check-demo.js

      # The unit tests above prove exactly-once on MemoryStore, which models
      # a Firestore transaction but is not one. This runs the scenarios that
      # actually depend on the store against the real Admin SDK and the
      # Firestore emulator, which needs a JVM.
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Firebase CLI
        run: npm install --global firebase-tools@15

      - name: Firestore emulator smoke test
        working-directory: firebase
        run: >
          firebase emulators:exec --only firestore --project traderescue-emulator
          "node functions/emulator-test/firestore.smoke.js"

      # Before trusting the lab, confirm it still catches a broken service.
      # If this fails, the lab has a blind spot and its result below means
      # nothing -- so it runs first.
      - name: Failure lab self-check
        run: node tools/lab-selfcheck.js

      - name: Failure lab
        run: node tools/failure-lab.js --report=failure-lab-ci.md

      - name: Upload the lab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-lab-report
          path: failure-lab-ci.md
          if-no-files-found: warn

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The wrapper is committed from Windows, where the executable bit is
      # not tracked.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
